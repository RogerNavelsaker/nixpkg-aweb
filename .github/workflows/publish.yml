name: Publish OCI images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build images
        run: |
          nix build .#aweb-image --out-link /tmp/aweb-image --print-build-logs
          nix build .#awid-image --out-link /tmp/awid-image --print-build-logs
      - name: Load and publish images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          AWEB_IMAGE: ghcr.io/rogernavelsaker/aweb
          AWID_IMAGE: ghcr.io/rogernavelsaker/awid
        run: |
          set -euo pipefail
          docker load --input /tmp/aweb-image
          docker load --input /tmp/awid-image
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          for image in "$AWEB_IMAGE" "$AWID_IMAGE"; do
            name="${image##*/}"
            docker tag "$name:unstable-2026-11-05" "$image:latest"
            docker tag "$name:unstable-2026-11-05" "$image:sha-${GITHUB_SHA::7}"
            docker push "$image:latest"
            docker push "$image:sha-${GITHUB_SHA::7}"
          done
